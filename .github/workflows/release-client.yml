name: release-client

# Builds the Windows MSI (with updater artifacts) and attaches it to a draft
# GitHub release. Triggered by a version tag, e.g. `v0.1.0`.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-msi:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/desktop/src-tauri

      - name: Install Tauri CLI
        working-directory: clients/desktop
        run: npm install

      - name: Build + sign + release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Generate with: npm exec tauri signer generate -- -w ~/.tauri/spuria.key
          # then set these repo secrets and paste the public key into tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: clients/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Spuria ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          # MSI + updater (.msi.zip + .sig + latest.json) come from tauri.conf.json.
          args: "--bundles msi,updater"
