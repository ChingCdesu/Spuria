[package]
name = "spuria-desktop"
version = "0.1.0"
edition = "2021"
description = "Spuria desktop client (controller + host)"
authors = ["Spuria contributors"]
license = "MIT"

# Own workspace: keep this out of the root crate workspace / CI test runs.
[workspace]

[[bin]]
name = "spuria-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
spuria-client = { path = "../../../crates/client" }
spuria-common = { path = "../../../crates/common" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
tempfile = "3"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_SystemInformation"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
