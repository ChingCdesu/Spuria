<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spuria</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="brand">Spuria</div>
    <nav>
      <button class="nav active" data-view="connect">Connect</button>
      <button class="nav" data-view="settings">Settings</button>
    </nav>
    <div class="sp"></div>
    <div class="device">
      <span class="muted">This device</span>
      <span id="device-id" class="mono chip">…</span>
    </div>
    <button id="check-update" class="ghost" title="Check for updates">⟳ Updates</button>
  </header>

  <div id="err"></div>

  <!-- ============ CONNECT VIEW ============ -->
  <main id="view-connect">
    <div id="not-configured" class="banner warn hidden">
      No server configured yet. Open <b>Settings</b> to set the signaling server, reflect address and team secret.
    </div>

    <div class="roles">
      <button class="role active" data-role="controller">主控 Controller</button>
      <button class="role" data-role="host">被控 Host</button>
    </div>

    <div class="grid">
      <label class="device-row">Device ID (optional override)
        <input id="device-override" type="text" placeholder="auto (persisted)" />
      </label>

      <label class="controller-only">Peer (host) device ID
        <input id="peer" type="text" placeholder="e.g. 123456789" />
      </label>
      <label class="controller-only">Local RDP listener
        <input id="listen" type="text" placeholder="127.0.0.1:33389" />
      </label>

      <label class="host-only">Local RDP service
        <input id="rdp" type="text" placeholder="127.0.0.1:3389" />
      </label>

      <label class="checkbox"><input id="force-relay" type="checkbox" /> Force relay (skip P2P)</label>
    </div>

    <div class="actions">
      <button id="connect" class="primary">Connect</button>
      <button id="disconnect" class="danger" disabled>Disconnect</button>
      <span id="state" class="state idle">idle</span>
    </div>

    <div id="ready" class="ready hidden"></div>

    <section class="log">
      <div class="log-head">
        <span>Activity</span>
        <button id="clear-log" class="ghost small">clear</button>
      </div>
      <div id="log"></div>
    </section>
  </main>

  <!-- ============ SETTINGS VIEW ============ -->
  <main id="view-settings" class="hidden">
    <p class="muted hint">
      Global settings, saved to this computer (<span class="mono">settings.json</span> in the app data
      folder) and shared across all connections.
    </p>
    <div class="grid">
      <label class="full">Signaling server
        <input id="server" type="text" placeholder="ws://host:21116" />
      </label>
      <label class="full">Reflect (srflx) address
        <input id="reflect" type="text" placeholder="host:21117" />
      </label>
      <label class="full">Team secret
        <input id="secret" type="password" placeholder="shared secret" />
      </label>
    </div>
    <div class="actions">
      <button id="save-settings" class="primary">Save settings</button>
      <span id="settings-status" class="muted"></span>
    </div>
  </main>

  <script src="main.js"></script>
</body>
</html>
